#config_version=6

# Base mode that starts at the beginning of each ball
# and stops at the end of each ball.

mode:
  start_events: ball_starting
  stop_events: ball_will_end
  priority: 100

event_player:
  mode_base_started:
    - start_mode_bumpers
  mode_base_started{current_player.ball == 1}:
    - start_mode_song
  mode_base_started{current_player.ball > 1}:
    - flippers_on
  mode_base_will_stop:
    - stop_mode_song
    - stop_mode_bumpers

slide_player:
  mode_base_started: base

light_player:
  mode_base_started:
    gi:
      color: "000000"

show_player:
  mode_base_started: base_lights
  s_plunger_lane_inactive:
    launch_show:
      priority: 1
      loops: 0

sound_player:
  s_plunger_lane_inactive:
    plunger:
      bus: effects
      volume: 1.0

variable_player:
  mode_base_started{current_player.ball == 1}:
    selected_song:
      string: "No Song Selected"
      action: set
