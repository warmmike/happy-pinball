#config_version=6

# Attract mode that starts when the machine boots up, stops
# whenever a game is started, and re-starts after the game ends.

mode:
  start_events: start_mode_song
  stop_events: song_item_selected
  game_mode: true
  priority: 120
  code: mpf.modes.carousel.code.carousel.Carousel

mode_settings:
  selectable_items:
    - hard_rock
    - metal
  select_item_events: s_start_active
  previous_item_events: s_flipper_left_inactive
  next_item_events: s_flipper_right_inactive

slide_player:
  mode_song_started: song

light_player:
  item_highlighted{item=="hard_rock"}:
    gi:
      color: ff2200
      fade: 200ms
  item_highlighted{item=="metal"}:
    gi:
      color: 660088
      fade: 200ms

random_event_player:
  song_hard_rock_selected:
    events:
      - song_song1_selected
      - song_song2_selected
  song_metal_selected:
    events:
      - song_song3_selected

event_player:
  song_song1_selected:
    - start_mode_song1
  song_song2_selected:
    - start_mode_song2
  song_song3_selected:
    - start_mode_song3

variable_player:
  song_hard_rock_selected:
    selected_song:
      string: "Hard Rock"
      action: set
  song_metal_selected:
    selected_song:
      string: "Metal"
      action: set
  item_highlighted:
    highlighted_song:
      string: "{item}"
      action: set
