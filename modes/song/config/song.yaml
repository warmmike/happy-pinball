#config_version=6

mode:
  start_events: start_mode_song
  stop_events: song_item_selected
  game_mode: true
  priority: 120
  code: mpf.modes.carousel.code.carousel.Carousel

mode_settings:
  selectable_items:
    - hard_rock
    - metal
  select_item_events: s_plunger_lane_inactive, timer_song_select_timer_complete
  previous_item_events: s_flipper_left_inactive
  next_item_events: s_flipper_right_inactive

slide_player:
  mode_song_started: song

light_player:
  item_highlighted{item=="hard_rock"}:
    gi:
      color: ff2200
      fade: 200ms
  item_highlighted{item=="metal"}:
    gi:
      color: 660088
      fade: 200ms

timers:
  song_select_timer:
    end_value: 10
    tick_interval: 1s
    start_running: true
    control_events:
      - event: s_flipper_left_inactive
        action: restart
      - event: s_flipper_right_inactive
        action: restart

variable_player:
  mode_song_started:
    song_countdown:
      int: 10
      action: set
  timer_song_select_timer_tick:
    song_countdown:
      int: -1
      action: add
  song_hard_rock_selected:
    selected_song:
      string: "Hard Rock"
      action: set
  song_metal_selected:
    selected_song:
      string: "Metal"
      action: set
  item_highlighted:
    highlighted_song:
      string: "{item}"
      action: set
