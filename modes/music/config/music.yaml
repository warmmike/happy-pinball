#config_version=6

mode:
  start_events: ball_starting
  stop_events: ball_will_end, tilt
  priority: 150

random_event_player:
  song_hard_rock_selected:
    force_different: true
    events:
      - song_song1_selected
      - song_song2_selected
  song_metal_selected:
    force_different: true
    events:
      - song_song3_selected

variable_player:
  song_song1_selected:
    current_song:
      string: song1
      action: set
  song_song2_selected:
    current_song:
      string: song2
      action: set
  song_song3_selected:
    current_song:
      string: song3
      action: set

sound_player:
  song_song1_selected:
    song1:
      bus: music
      action: play
      loops: -1
  song_song2_selected:
    song2:
      bus: music
      action: play
      loops: -1
  song_song3_selected:
    song3:
      bus: music
      action: play
      loops: -1
  tilt{current_player.current_song=="song1"}:
    song1:
      action: stop
  tilt{current_player.current_song=="song2"}:
    song2:
      action: stop
  tilt{current_player.current_song=="song3"}:
    song3:
      action: stop
