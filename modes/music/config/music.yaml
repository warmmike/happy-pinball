#config_version=6

mode:
  start_events: ball_starting
  stop_events: ball_will_end, tilt
  priority: 150

event_player:
  # Ball 1: highlighted_song is set before mode_music_started fires
  mode_music_started{current_player.ball == 1 and current_player.highlighted_song == "hard_rock"}:
    - pick_hard_rock_song
  mode_music_started{current_player.ball == 1 and current_player.highlighted_song == "metal"}:
    - pick_metal_song
  # Ball 2+: resume from stored genre
  mode_music_started{current_player.ball > 1 and current_player.selected_song == "Hard Rock"}:
    - pick_hard_rock_song
  mode_music_started{current_player.ball > 1 and current_player.selected_song == "Metal"}:
    - pick_metal_song

random_event_player:
  # Use pick_* events so song mode's commit (song_hard_rock_selected) doesn't retrigger
  pick_hard_rock_song:
    force_different: true
    events:
      - song_song1_selected
      - song_song2_selected
  pick_metal_song:
    events:
      - song_song3_selected
  item_highlighted{item=="hard_rock"}:
    force_different: true
    events:
      - song_song1_selected
      - song_song2_selected
  item_highlighted{item=="metal"}:
    events:
      - song_song3_selected

variable_player:
  song_song1_selected:
    current_song:
      string: song1
      action: set
  song_song2_selected:
    current_song:
      string: song2
      action: set
  song_song3_selected:
    current_song:
      string: song3
      action: set

sound_player:
  song_song1_selected:
    song1:
      bus: music
      action: play
      loops: -1
  song_song2_selected:
    song2:
      bus: music
      action: play
      loops: -1
  song_song3_selected:
    song3:
      bus: music
      action: play
      loops: -1
