#config_version=6

## MPF Main Machine Config File
#
# This file defines your system-wide properties like switches,
# drivers, ball devices, hardware platforms, and more. You can
# include everything here, or create sub-config files to be
# imported and merged with this one.

config:
  - config.yaml

#CobraPin Example Config
hardware:
  platform: opp
  driverboards: gen2
#  switches: virtual

opp:
  #Use the USB ports defined by your OS for the two STM32 boards
  ports: /dev/ttyACM0, /dev/ttyACM1
  #USING SERIAL NUMBERS INSTEAD OF CHAINS
  #  Board 0 has serial number 0, Board 1 has serial number 1.
  #  This is convenient if your OS tends to reassign the serial port.
  #  MPF will automatically address the correct board even if the ports
  #     are swapped.

  #For multiple CobraPin boards in a game, you will either have to give
  #  the STM32 boards on the second CobraPin board new serial numbers
  #  (10 and 11 are suggested for the 2nd board since 2 is used by the
  #  CobraPin Xpansion Board)
  #  <OR> Use the chains section to assign a port to a board number.
  #  Mixing these up could cause blown FETs, coils, and fuses. Proceed
  #  with caution. Test without coil power and use the yellow coil LEDs
  #  for feedback.
  #chains:
     #0: /dev/ttyACM0
     #1: /dev/ttyACM1


psus:
  default:
    #Gives the capacitors extra time to recharge after firing a coil
    #  and eases the load on the power supply. Doesn't affect autofire
    #  devices like flippers, pops, slings.
    release_wait_ms: 50

flippers:
  # Flippers are LIVE only while a ball is in play.
  #
  # Enable trigger is ball_started (MPF fires this once the ball is confirmed on
  # the playfield, gated through the bd_plunger ball-device state machine). This
  # replaces enable_events: s_plunger_lane_inactive, which was fragile: the
  # shooter-lane switch sits inactive whenever the lane is empty, so any stray
  # inactive transition (boot broadcast, switch bounce, inverted/NC wiring) armed
  # the flippers with nothing to disarm them until the next ball_ending -- coils
  # live through attract and song select.
  #
  # disable_events must cover every "ball not in play" state. Do not trim it.
  left_flipper:
    main_coil: c_flipper_left_main
    hold_coil: c_flipper_left_hold
    activation_switch: s_flipper_left
    eos_switch: s_eos_left
    enable_events: ball_started
    disable_events: ball_will_end, ball_ending, tilt, mode_attract_started, mode_song_started, machine_reset_phase_3

  right_flipper:
    main_coil: c_flipper_right_main
    hold_coil: c_flipper_right_hold
    activation_switch: s_flipper_right
    eos_switch: s_eos_right
    enable_events: ball_started
    disable_events: ball_will_end, ball_ending, tilt, mode_attract_started, mode_song_started, machine_reset_phase_3
